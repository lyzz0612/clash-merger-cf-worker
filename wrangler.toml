name = "clash-merger-cf-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "CLASH_KV"
id = "placeholder-kv-id"

# 定时刷新订阅缓存（UTC），默认每 6 小时一次
[triggers]
crons = ["0 */6 * * *"]

[vars]
# TOKEN = "your-secret-token"

[observability]
[observability.logs]
enabled = true
invocation_logs = true